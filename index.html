<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mian Muhammad Atif — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#c9f52b;
  --teal:#68e5df;
  --dark:#040c10;
  --card:#0a1820;
  --line:rgba(190,220,220,.14);
  --text:#c8d5d7;
  --muted:#7a9498;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'Manrope',sans-serif;
  background:var(--dark);
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,245,43,.25);border-radius:10px}

/* ---- NAV ---- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 40px;
  background:rgba(4,12,16,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  transition:.35s ease;
}
nav.scrolled{padding:12px 40px;background:rgba(4,12,16,.92)}
.nav-logo{
  font:700 15px/1 'Space Grotesk',sans-serif;
  color:#fff;letter-spacing:-.02em;
}
.nav-logo span{color:var(--lime)}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{
  color:var(--muted);text-decoration:none;
  font:500 13px/1 Manrope;letter-spacing:.04em;
  text-transform:uppercase;transition:.3s ease;
  position:relative;
}
.nav-links a::after{
  content:"";position:absolute;bottom:-4px;left:0;
  width:0;height:2px;background:var(--lime);
  transition:.3s ease;border-radius:2px;
}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}
.nav-cta{
  padding:8px 20px;border-radius:8px;
  background:var(--lime);color:var(--dark);
  font:700 12px/1 Manrope;letter-spacing:.04em;
  text-transform:uppercase;text-decoration:none;
  transition:.3s ease;border:none;cursor:pointer;
}
.nav-cta:hover{box-shadow:0 0 25px rgba(201,245,43,.35);transform:translateY(-2px)}

/* ---- HERO ---- */
.hero{
  min-height:100vh;display:flex;align-items:center;
  padding:100px 40px 60px;
  max-width:1280px;margin:0 auto;gap:60px;
}
.hero-content{flex:1;max-width:540px}
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;
  background:rgba(201,245,43,.08);
  border:1px solid rgba(201,245,43,.2);
  font:600 10px/1 Manrope;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lime);
  margin-bottom:24px;
}
.hero-tag .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--lime);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.hero h1{
  font:800 clamp(36px,5vw,62px)/1.05 'Space Grotesk',sans-serif;
  color:#fff;letter-spacing:-.04em;
  margin-bottom:20px;
}
.hero h1 .accent{color:var(--lime)}
.hero-desc{
  font:400 15px/1.7 Manrope;color:var(--muted);
  margin-bottom:32px;max-width:460px;
}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.btn-primary{
  padding:14px 28px;border-radius:10px;
  background:var(--lime);color:var(--dark);
  font:700 13px/1 Manrope;letter-spacing:.04em;
  text-transform:uppercase;text-decoration:none;
  transition:.35s ease;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary:hover{box-shadow:0 0 35px rgba(201,245,43,.35);transform:translateY(-3px)}
.btn-secondary{
  padding:14px 28px;border-radius:10px;
  background:transparent;color:#fff;
  font:600 13px/1 Manrope;letter-spacing:.04em;
  text-transform:uppercase;text-decoration:none;
  border:1px solid rgba(255,255,255,.2);
  transition:.35s ease;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-secondary:hover{border-color:var(--lime);color:var(--lime);transform:translateY(-3px)}

/* ---- VISUAL / PHOTO ---- */
.visual{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.photoFrame{
  width:390px;height:390px;position:relative;
  background:#10252d;overflow:hidden;z-index:2;
  border:3px solid rgba(201,245,43,.75);
  border-radius:50%;
  box-shadow:
    0 0 0 8px rgba(201,245,43,.08),
    0 22px 55px rgba(0,0,0,.45);
  transition:.45s ease;
}
.photoFrame:before{
  content:"";position:absolute;inset:-10px;
  border:1px solid rgba(104,229,223,.45);
  border-radius:50%;z-index:-1;
}
.photoFrame:after{
  content:"";position:absolute;inset:14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;pointer-events:none;
}
.photoFrame:hover{
  transform:translateY(-7px) scale(1.025);
  border-color:var(--lime);
  box-shadow:
    0 0 0 10px rgba(201,245,43,.10),
    0 25px 70px rgba(0,0,0,.65),
    0 0 45px rgba(201,245,43,.18);
}
.photo{
  width:100%;height:100%;
  object-fit:cover;object-position:center 18%;
  border-radius:50%;
  filter:saturate(.82) contrast(1.04);
  transition:.8s ease;
}
.photoFrame:hover .photo{transform:scale(1.055)}
.corner{
  position:absolute;left:50%;bottom:25px;
  transform:translateX(-50%);
  background:rgba(4,12,16,.92);color:#fff;
  padding:9px 16px;
  border:1px solid rgba(201,245,43,.30);
  border-radius:20px;
  font:600 7px Manrope;letter-spacing:.12em;
  text-transform:uppercase;white-space:nowrap;
  z-index:3;box-shadow:0 8px 25px rgba(0,0,0,.45);
}
.corner span{display:none}

/* ---- SECTION COMMON ---- */
section{padding:80px 40px;max-width:1280px;margin:0 auto}
.section-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:16px;
  background:rgba(201,245,43,.06);
  border:1px solid rgba(201,245,43,.15);
  font:600 10px/1 Manrope;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lime);
  margin-bottom:16px;
}
.section-title{
  font:700 clamp(28px,3.5vw,44px)/1.1 'Space Grotesk',sans-serif;
  color:#fff;letter-spacing:-.03em;margin-bottom:12px;
}
.section-desc{
  font:400 14px/1.65 Manrope;color:var(--muted);
  max-width:500px;margin-bottom:40px;
}
.scroll-row{
  display:flex;gap:20px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding-bottom:16px;
  -ms-overflow-style:none;scrollbar-width:none;
}
.scroll-row::-webkit-scrollbar{display:none}

/* ---- WORKFLOW ---- */
.wfCard{
  min-width:270px;width:270px;height:310px;
  background:linear-gradient(145deg,#102a33,#07151b);
  color:#fff;padding:22px;position:relative;
  scroll-snap-align:start;flex-shrink:0;
  overflow:hidden;
  border:1px solid rgba(190,220,220,.14);
  border-radius:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  transition:.4s ease;
}
.wfCard:hover{
  transform:translateY(-8px);
  border-color:rgba(201,245,43,.55);
  background:linear-gradient(145deg,#193a43,#0a1d24);
  box-shadow:
    0 20px 45px rgba(0,0,0,.55),
    0 0 28px rgba(201,245,43,.12),
    6px 6px 0 rgba(201,245,43,.08);
}
.wfCard .step{
  font:700 11px/1 'Space Grotesk',sans-serif;
  color:var(--lime);letter-spacing:.1em;
  margin-bottom:8px;
}
.wfCard h3{
  font:600 26px/1 Manrope;letter-spacing:-.05em;
  margin:52px 0 14px;
}
.wfCard p{
  font-size:11px;line-height:1.6;color:#aab9bb;
  margin:0;max-width:220px;
}
.wfCard .icon-circle{
  width:38px;height:38px;border-radius:10px;
  background:rgba(201,245,43,.1);
  border:1px solid rgba(201,245,43,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}

/* ---- EXPORT JOURNEY ---- */
.journey-card{
  min-width:270px;width:270px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(17,39,48,.9),rgba(6,17,22,.96));
  transition:.4s ease;flex-shrink:0;
  scroll-snap-align:start;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  overflow:hidden;border-radius:14px;
}
.journey-card:hover{
  transform:translateY(-8px);
  border-color:rgba(104,229,223,.5);
  box-shadow:
    0 22px 48px rgba(0,0,0,.58),
    0 0 28px rgba(104,229,223,.10),
    6px 6px 0 rgba(104,229,223,.07);
}
.journey-image{
  height:170px;overflow:hidden;
}
.journey-image img{
  width:100%;height:100%;object-fit:cover;
  transition:.5s ease;filter:saturate(.85);
}
.journey-card:hover .journey-image img{
  transform:scale(1.08);filter:saturate(1.05);
}
.journey-copy{padding:18px}
.journey-copy h3{
  font:600 22px Manrope;letter-spacing:-.04em;
  margin:8px 0;
}
.journey-copy p{
  font-size:11px;line-height:1.55;min-height:52px;
  color:var(--muted);
}
.journey-copy .tag{
  display:inline-block;padding:3px 10px;border-radius:6px;
  background:rgba(104,229,223,.1);
  border:1px solid rgba(104,229,223,.2);
  font:600 9px/1 Manrope;letter-spacing:.1em;
  text-transform:uppercase;color:var(--teal);
  margin-bottom:4px;
}

/* ---- STATS ---- */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
}
.stat-box{
  padding:28px 22px;border-radius:14px;
  background:linear-gradient(145deg,
